version: openmanifest/app/v1alpha1
app:
  name: openmanifest-neon-example
  description: Neon project, database branch, and role

targets:
  production:
    provider: neon
    region: aws-us-east-2

databases:
  primary:
    engine: postgres
    version: "16"
    plan: free

resources:
  branch:analytics:
    kind: database_branch
    capabilities:
      - postgres
    depends_on:
      - database:primary
    properties:
      name: analytics

  role:application:
    kind: database_role
    capabilities:
      - postgres
    depends_on:
      - branch:analytics
      - database:primary
    properties:
      name: application

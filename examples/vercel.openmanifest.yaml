version: openmanifest/app/v1alpha1
app:
  name: openmanifest-vercel-example
  description: Vercel project, environment variables, and custom domain

targets:
  production:
    provider: vercel
    environment: production

services:
  web:
    source:
      repository: djsydney04/openStack
    build:
      framework: nextjs
      command: npm run build
      output: .next
    env:
      API_BASE_URL: https://api.example.com
      SESSION_SECRET:
        secret: SESSION_SECRET
    deploy:
      domains:
        - app.example.com

secrets:
  SESSION_SECRET:
    from: env:SESSION_SECRET
    description: Runtime session signing secret

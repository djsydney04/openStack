name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p stackport-cli -- stack validate examples/vercel.stack.yaml --target production
      - run: cargo run -q -p stackport-cli -- stack validate examples/supabase.stack.yaml --target production
      - run: cargo run -q -p stackport-cli -- stack validate examples/neon.stack.yaml --target production
      - run: cargo run -q -p stackport-cli -- stack validate examples/railway.stack.yaml --target production
      - run: cargo run -q -p stackport-cli -- providers doctor
      - run: bash tests/ci-workflow.sh
      - run: npm test --prefix packages/typescript
      - run: python3 -m unittest discover -s packages/python/tests

  reusable-workflow-smoke:
    permissions:
      contents: write
    uses: ./.github/workflows/stackport.yml
    with:
      stack_file: examples/vercel.stack.yaml
      target: production
      state_key: ci-smoke
      stackport_ref: ${{ github.sha }}
      apply_on_push: false

[workspace]
members = [
  "crates/stackport-core",
  "crates/stackport-cli",
  "crates/stackport-sdk",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "git@github.com:djsydney04/openStack.git"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
